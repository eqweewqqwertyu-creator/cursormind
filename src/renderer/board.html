<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>灵标看板</title>
  <style>
    html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; user-select: none; font-family: "Microsoft YaHei", "Segoe UI", sans-serif; }

    /* 卡片容器：圆角玻璃（与面板同源设计语言） */
    #card {
      position: fixed; inset: 0;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(255,255,255,0.92), rgba(246,248,251,0.9));
      backdrop-filter: blur(18px) saturate(1.2);
      -webkit-backdrop-filter: blur(18px) saturate(1.2);
      border: 1px solid rgba(255,255,255,0.85);
      box-shadow: 0 0 26px rgba(160,190,235,0.35), 0 8px 24px rgba(40,60,100,0.16);
      display: flex; flex-direction: column;
      overflow: hidden;
      transition: border-radius 0.2s ease;
    }

    /* ---------- 头部（拖拽把手） ---------- */
    header {
      flex: none; height: 46px;
      display: flex; align-items: center; gap: 8px;
      padding: 0 10px 0 16px;
      cursor: grab;
      border-bottom: 1px solid rgba(0,0,0,0.06);
      background: rgba(255,255,255,0.35);
      -webkit-app-region: no-drag;
    }
    header:active { cursor: grabbing; }
    .title {
      flex: 1; font-size: 14px; color: #3F3F46; font-weight: 600;
      display: flex; align-items: center; gap: 8px; white-space: nowrap; overflow: hidden;
    }
    .title::before {
      content: ''; width: 8px; height: 8px; border-radius: 3px;
      background: linear-gradient(135deg, #F97316, #FB923C); flex: none;
    }
    .hbtn {
      flex: none; width: 28px; height: 28px; border: none; border-radius: 8px;
      background: transparent; color: #8C8C8C; font-size: 14px; line-height: 1;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.15s ease; font-family: inherit;
    }
    .hbtn:hover { background: rgba(124,147,184,0.14); color: #5A6982; }

    /* ---------- 便签列表 ---------- */
    #list { flex: 1; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
    #list::-webkit-scrollbar { width: 6px; }
    #list::-webkit-scrollbar-thumb { background: rgba(124,147,184,0.35); border-radius: 3px; }

    .note {
      position: relative;
      border-radius: 12px;
      padding: 10px 34px 10px 12px;
      border: 1px solid rgba(255,255,255,0.7);
      box-shadow: 0 2px 6px rgba(40,60,100,0.08);
      display: flex; flex-direction: column; gap: 5px;
    }
    .note.done { opacity: 0.55; }
    .note.done .txt { text-decoration: line-through; color: #8C8C8C; }
    .note .txt { font-size: 13.5px; color: #2A2A30; line-height: 1.45; word-break: break-word; }
    .note .meta { font-size: 11px; color: #8C8C8C; display: flex; align-items: center; gap: 5px; }
    .note .meta .clock { flex: none; }
    .note .done-btn {
      position: absolute; right: 8px; top: 8px;
      width: 22px; height: 22px; border: 1.5px solid rgba(124,147,184,0.45);
      border-radius: 50%; background: rgba(255,255,255,0.6); color: #fff;
      font-size: 12px; line-height: 1; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s ease; font-family: inherit; padding: 0;
    }
    .note.done .done-btn { background: #7C93B8; border-color: #7C93B8; }
    .note .del {
      position: absolute; right: 34px; top: 10px;
      border: none; background: transparent; color: #C4C4CB; font-size: 14px; cursor: pointer; line-height: 1;
    }
    .note .del:hover { color: #F97316; }
    /* 便签贴条色系（浅色，互不干扰） */
    .note.c0 { background: #FFF7E6; } .note.c1 { background: #EAF2FE; }
    .note.c2 { background: #ECFDF3; } .note.c3 { background: #FAEAFE; }
    .note.c4 { background: #FFF0F0; }

    /* ---------- 新增行 ---------- */
    #addbar {
      flex: none; display: flex; align-items: center; gap: 8px;
      padding: 10px 12px; border-top: 1px solid rgba(0,0,0,0.06);
      background: rgba(255,255,255,0.4);
    }
    #addbar input[type=text] {
      flex: 1; min-width: 0;
      border: 1px solid rgba(140,140,140,0.28); border-radius: 9px;
      background: rgba(255,255,255,0.7); padding: 7px 10px; font-size: 13px; color: #2A2A30;
      outline: none; font-family: inherit;
    }
    #addbar input[type=text]:focus { border-color: #7C93B8; }
    #addbar input[type=text]::placeholder { color: #B0B0B0; }
    #addbar input[type=datetime-local] {
      width: 138px; border: 1px solid rgba(140,140,140,0.28); border-radius: 9px;
      background: rgba(255,255,255,0.7); padding: 6px 6px; font-size: 12px; color: #5A6982; outline: none;
      font-family: inherit;
    }
    #addBtn {
      flex: none; border: none; border-radius: 9px; background: #7C93B8; color: #fff;
      font-size: 13px; padding: 7px 14px; cursor: pointer; transition: all 0.15s ease; font-family: inherit;
    }
    #addBtn:hover { background: #5A6982; }
    #addBtn:disabled { background: #CBD5E1; cursor: default; }

    /* ---------- 停靠把手（docked 态：24×120 小条，仅抓手纹，不占整条高度） ---------- */
    #dockbar {
      display: none;
      position: absolute; inset: 0;
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(255,255,255,0.62), rgba(240,244,252,0.62));
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.65);
      box-shadow: 0 4px 14px rgba(40,60,100,0.14);
      cursor: pointer;
      flex-direction: column; align-items: center; justify-content: center; gap: 7px;
    }
    #dockbar .grip {
      width: 15px; height: 3px; border-radius: 2px; background: rgba(124,147,184,0.75);
    }
    #dockbar .grip.g2 { width: 11px; opacity: 0.7; }
    #dockbar .grip.g3 { width: 7px; opacity: 0.5; }
    #dockbar:hover .grip { background: rgba(124,147,184,0.9); }

    body.docked #card { display: none; }
    body.docked #dockbar { display: flex; }
  </style>
</head>
<body class="">
  <div id="card">
    <header id="hdr">
      <div class="title">灵标看板</div>
      <button class="hbtn" id="btnCollapse" title="收起停靠">◧</button>
      <button class="hbtn" id="btnHide" title="关闭（任务保留）">×</button>
    </header>
    <div id="list"></div>
    <div id="addbar">
      <input type="text" id="inText" placeholder="添加待办…" autocomplete="off" />
      <input type="datetime-local" id="inTime" title="提醒时间（可留空）" />
      <button id="addBtn">添加</button>
    </div>
  </div>

  <div id="dockbar" title="展开看板">
    <div class="grip"></div><div class="grip g2"></div><div class="grip g3"></div>
  </div>

  <script src="./board.js"></script>
</body>
</html>
