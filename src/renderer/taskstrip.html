<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>灵标后台任务</title>
  <style>
    html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; user-select: none; font-family: "Microsoft YaHei", "Segoe UI", sans-serif; }

    /* ---------- 紧凑胶囊 ---------- */
    #compact {
      position: fixed; inset: 0;
      border-radius: 23px;
      background: linear-gradient(180deg, rgba(255,255,255,0.92), rgba(246,248,251,0.9));
      backdrop-filter: blur(18px) saturate(1.2);
      -webkit-backdrop-filter: blur(18px) saturate(1.2);
      border: 1px solid rgba(255,255,255,0.85);
      box-shadow: 0 0 22px rgba(160,190,235,0.35), 0 6px 18px rgba(40,60,100,0.14);
      display: flex; align-items: center; gap: 9px;
      padding: 0 14px 0 12px;
      cursor: pointer;
      overflow: hidden;
      white-space: nowrap;
    }
    body.list #compact { display: none; }

    .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; }
    .dot.run { background: #F97316; animation: pulse 1.1s ease-in-out infinite; }
    .dot.idle { background: #10B981; }
    .dot.warn { background: #9CA3AF; }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(249,115,22,0.45); transform: scale(1); }
      50% { box-shadow: 0 0 0 5px rgba(249,115,22,0); transform: scale(1.15); }
    }

    #compact .cnt { flex: none; font-size: 12.5px; font-weight: 700; color: #F97316; }
    #compact .cnt.ok { color: #10B981; }
    #compact .cnt.warn { color: #8C8C8C; }
    #compact .t { flex: 1; min-width: 0; font-size: 12.5px; color: #3F3F46; overflow: hidden; text-overflow: ellipsis; }
    #compact .t::after { content: ''; }
    #compact .arrow { flex: none; font-size: 10px; color: #8C8C8C; transition: transform 0.15s ease; }
    #compact:hover .arrow { color: #F97316; }

    /* 完成时闪一下 */
    #compact.flash { animation: flash 1.2s ease; }
    @keyframes flash {
      0%, 100% { box-shadow: 0 0 22px rgba(160,190,235,0.35), 0 6px 18px rgba(40,60,100,0.14); }
      40% { box-shadow: 0 0 26px rgba(16,185,129,0.55), 0 6px 18px rgba(40,60,100,0.14); }
    }

    /* ---------- 展开列表 ---------- */
    #list {
      display: none;
      position: fixed; inset: 0;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(255,255,255,0.92), rgba(246,248,251,0.9));
      backdrop-filter: blur(18px) saturate(1.2);
      -webkit-backdrop-filter: blur(18px) saturate(1.2);
      border: 1px solid rgba(255,255,255,0.85);
      box-shadow: 0 0 26px rgba(160,190,235,0.35), 0 8px 24px rgba(40,60,100,0.16);
      flex-direction: column;
      overflow: hidden;
    }
    body.list #list { display: flex; }

    header {
      flex: none; height: 44px;
      display: flex; align-items: center; gap: 8px;
      padding: 0 10px 0 16px;
      border-bottom: 1px solid rgba(0,0,0,0.06);
      background: rgba(255,255,255,0.35);
    }
    .title {
      flex: 1; font-size: 14px; color: #3F3F46; font-weight: 600;
      display: flex; align-items: center; gap: 8px;
    }
    .title::before {
      content: ''; width: 8px; height: 8px; border-radius: 3px;
      background: linear-gradient(135deg, #F97316, #FB923C); flex: none;
    }
    .hbtn {
      flex: none; border: none; border-radius: 8px;
      background: transparent; color: #8C8C8C; font-size: 13px; line-height: 1;
      cursor: pointer; padding: 7px 9px; font-family: inherit;
      transition: all 0.15s ease; white-space: nowrap;
    }
    .hbtn:hover { background: rgba(124,147,184,0.14); color: #5A6982; }
    .hbtn.clear { font-size: 12px; }

    #rows { flex: 1; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
    #rows::-webkit-scrollbar { width: 6px; }
    #rows::-webkit-scrollbar-thumb { background: rgba(124,147,184,0.35); border-radius: 3px; }
    #rows .empty { flex: 1; display: flex; align-items: center; justify-content: center; color: #B0B0B0; font-size: 13px; }

    .tcard {
      position: relative;
      border-radius: 12px;
      padding: 10px 30px 10px 12px;
      border: 1px solid rgba(255,255,255,0.7);
      box-shadow: 0 2px 6px rgba(40,60,100,0.08);
      display: flex; flex-direction: column; gap: 5px;
      background: rgba(255,255,255,0.72);
    }
    .tcard .head { display: flex; align-items: center; gap: 8px; }
    .tcard .sdot { flex: none; width: 9px; height: 9px; border-radius: 50%; }
    .sdot.running { background: #F97316; animation: pulse 1.1s ease-in-out infinite; }
    .sdot.queued { background: #7C93B8; }
    .sdot.done { background: #10B981; }
    .sdot.failed { background: #EF4444; }
    .sdot.blocked { background: #F97316; }
    .sdot.cancelled { background: #9CA3AF; }
    .tcard .tt { flex: 1; min-width: 0; font-size: 13px; color: #2A2A30; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tcard .meta { font-size: 11px; color: #8C8C8C; display: flex; align-items: center; gap: 5px; padding-left: 17px; flex-wrap: wrap; }
    .tcard .acts { display: flex; gap: 6px; padding-left: 17px; }
    .tcard .del {
      position: absolute; right: 7px; top: 8px;
      border: none; background: transparent; color: #C4C4CB; font-size: 14px; cursor: pointer; line-height: 1;
      padding: 3px 4px;
    }
    .tcard .del:hover { color: #F97316; }
    .abtn {
      border: none; border-radius: 7px; font-size: 11.5px; padding: 4px 10px;
      cursor: pointer; font-family: inherit; transition: all 0.15s ease; line-height: 1.3;
    }
    .abtn.cancel { background: rgba(124,147,184,0.16); color: #5A6982; }
    .abtn.cancel:hover { background: rgba(124,147,184,0.3); }
    .abtn.view { background: rgba(249,115,22,0.12); color: #C2560B; }
    .abtn.view:hover { background: rgba(249,115,22,0.22); }
    .tcard.st-done { background: rgba(236,253,243,0.85); }
    .tcard.st-failed { background: rgba(255,240,240,0.85); }
    .tcard.st-blocked { background: rgba(255,247,230,0.9); }
  </style>
</head>
<body class="">
  <div id="compact" title="点开后台任务列表">
    <div class="dot run" id="cDot"></div>
    <span class="cnt" id="cCnt">后台</span>
    <span class="t" id="cTitle"></span>
    <span class="arrow">▾ 展开</span>
  </div>

  <div id="list">
    <header>
      <div class="title">后台任务</div>
      <button class="hbtn clear" id="btnClear">清除已完成</button>
      <button class="hbtn" id="btnCollapse" title="收起">◧</button>
    </header>
    <div id="rows"></div>
  </div>

  <script src="./taskstrip.js"></script>
</body>
</html>
