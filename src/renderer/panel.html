<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>cursormind panel</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
    }
    .wrap {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .reply {
      display: none;
      background: #ffffff;
      border: 1.5px solid #F97316;
      border-radius: 16px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.18);
      padding: 12px 16px;
      box-sizing: border-box;
      max-height: 180px;
      overflow-y: auto;
      font-size: 14px;
      line-height: 1.55;
      color: #1A1A1A;
      word-break: break-word;
    }
    .reply.show { display: block; }
    .box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #ffffff;
      border: 1.5px solid #F97316;
      border-radius: 16px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.18);
      padding: 12px 16px;
      box-sizing: border-box;
    }
    .reset {
      flex: none;
      width: 26px;
      height: 26px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: #9A9A9A;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s, transform 0.15s;
    }
    .reset:hover {
      background: #FFF1E8;
      color: #F97316;
      transform: rotate(-120deg);
    }
    .reset:active {
      transform: rotate(-180deg) scale(0.92);
    }
    .mark {
      flex: none;
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: #F97316;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      line-height: 1;
    }
    input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-size: 16px;
      color: #1A1A1A;
      padding: 4px 0;
    }
    input::placeholder {
      color: #9A9A9A;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="reply" id="reply"></div>
    <div class="box">
      <div class="mark">◎</div>
      <input id="q" placeholder="问一句，比如「怎么看 issues」" autocomplete="off" spellcheck="false" />
      <button id="reset" class="reset" title="新建对话（清空上下文）">↺</button>
    </div>
  </div>
  <script src="./panel.js"></script>
</body>
</html>
